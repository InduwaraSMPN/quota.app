# ===================================
# Quota App Backend Configuration
# ===================================
# Copy this file to application.properties and fill in your actual values

# Database Configuration for quota.app
spring.datasource.url=jdbc:postgresql://your-database-host:5432/your-database-name
spring.datasource.username=your-database-username
spring.datasource.password=your-database-password
spring.datasource.driver-class-name=org.postgresql.Driver

# DMT Database Configuration
dmt.datasource.url=jdbc:postgresql://your-dmt-database-host:5432/your-dmt-database-name
dmt.datasource.username=your-dmt-database-username
dmt.datasource.password=your-dmt-database-password
dmt.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=your-jwt-secret-key-here-make-it-long-and-secure
jwt.expiration=86400000

# CORS Configuration
cors.allowed.origins=http://localhost:3000,http://localhost:3001,http://localhost:3002

# Spring Session Configuration
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=30m

# Session Cookie Configuration
server.servlet.session.cookie.name=QUOTA_SESSION
server.servlet.session.cookie.max-age=1800
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Twilio Configuration for SMS notifications (Mobile App)
twilio.account.sid=your-twilio-account-sid
twilio.auth.token=your-twilio-auth-token
twilio.phone.number=your-twilio-phone-number
twilio.enabled=true

# Logging Configuration
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.cors=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.session=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.com.quotaapp.backend=DEBUG
logging.level.com.quotaapp.backend.filter=TRACE
